<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -4 425 208" width="850" height="416" role="img" aria-label="Harmony Stack">
  <title>Harmony Stack</title>
  <g transform="skewX(-16)">
    <!-- H (white): left stem + crossbar, then a sliced right stem -->
    <g fill="#ffffff">
      <path d="M0 0H52V76H100L88 124H52V200H0Z"/>
      <path d="M108 0H160V200H108Z"/>
    </g>
